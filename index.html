<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12161C"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Steeldart"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Steeldart – Dart-Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E3E6E3;--card:#fff;--ink:#14181E;--mut:#5C6670;--line:#C9CFCC;--red:#C93027;--grn:#1B7F52;--br:#9A6F10;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--card:#1B212A;--ink:#F1EEE6;--mut:#8F9CA9;--line:#2A323D;--red:#E5473C;--grn:#2BA66F;--br:#D6AD4F}}
:root[data-theme="dark"]{--bg:#12161C;--card:#1B212A;--ink:#F1EEE6;--mut:#8F9CA9;--line:#2A323D;--red:#E5473C;--grn:#2BA66F;--br:#D6AD4F}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{touch-action:manipulation;margin:0;font:500 16px/1.4 Barlow,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit;cursor:pointer}
#app{max-width:560px;margin:0 auto;padding:16px 14px 100px}
h1,h2,.big,.k,.go,.nav button,.tile b{font-family:'Big Shoulders Display',Impact,sans-serif}
h1{font-size:52px;line-height:.9;margin:0;font-weight:900}
h2{font-size:21px;font-weight:700;margin:22px 0 8px}
.sub{color:var(--mut);font-size:14px}
.hero{display:flex;gap:16px;align-items:center}
.board{flex:none;width:76px;height:76px;border-radius:50%;border:3px solid #0b0e12;background:radial-gradient(circle,var(--red) 0 9%,var(--grn) 9% 19%,transparent 19%),radial-gradient(circle,transparent 0 60%,var(--red) 60% 70%,transparent 70% 83%,var(--grn) 83% 93%,transparent 93%),repeating-conic-gradient(#171B22 0 18deg,#E9E2CF 18deg 36deg)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.ch{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 15px;font-weight:600;font-size:15px;display:inline-flex;gap:8px;align-items:center}
.ch.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ch b{opacity:.6;font-size:17px;padding:0 2px}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;font:600 15px Barlow,sans-serif}
.lnk{background:none;border:0;color:var(--mut);padding:10px 2px;font-size:14px;text-decoration:underline}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.md{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 8px;text-align:left;display:flex;flex-direction:column;gap:2px}
.md b{font-size:17px}.md span{font-size:12px;color:var(--mut)}
.md.on{border-color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.go{width:100%;margin-top:26px;padding:14px;border:0;border-radius:16px;background:var(--red);color:#fff;font-size:32px;font-weight:900;letter-spacing:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.pc{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 16px 12px;margin-bottom:10px}
.pc.on{border-color:var(--br)}
.pn{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pn b{font-size:18px}.pn span{color:var(--mut);font-size:14px}
.big{font-size:88px;line-height:.95;font-weight:900;font-variant-numeric:tabular-nums}
.pc.on .big{color:var(--br)}.pc:not(.on) .big{font-size:54px;color:var(--mut)}
.th{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.th i{font:700 17px Barlow,sans-serif;background:var(--bg);border-radius:8px;padding:2px 10px;min-width:40px;text-align:center}
.mid{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sl{display:flex;gap:4px}.sl i{width:46px;height:56px;border-radius:9px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;line-height:1.15}
.sl i b{font:800 18px Barlow,sans-serif}.sl i small{font-size:12px;color:var(--mut)}.sl i.e{color:var(--mut);font-size:22px}
.sl .sm{width:52px;height:56px;border-radius:9px;background:var(--br);color:#fff;display:flex;align-items:center;justify-content:center;font:900 28px 'Big Shoulders Display',sans-serif}
.co{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;color:var(--grn);font-weight:700}
.co span{font-size:13px;color:var(--mut);font-weight:600}.co p{margin:0;background:var(--bg);padding:3px 10px;border-radius:8px}.co p.alt{font-weight:600;opacity:.7}.co.a p:first-of-type{outline:2px solid var(--grn)}
.vl{margin-top:8px;max-height:118px;overflow-y:auto;border-top:1px solid var(--line);padding-top:6px;font-size:14px}
.vl div{display:flex;align-items:center;gap:6px;padding:2px 0}.vl span{width:20px;color:var(--mut)}.vl u{text-decoration:none;background:var(--bg);border-radius:6px;padding:0 7px;min-width:34px;text-align:center}.vl u.bu{color:var(--red)}.vl em{font-style:normal;font-weight:800;margin-left:auto}.vl small{width:64px;text-align:right;color:var(--mut)}
.hint{margin-top:6px;color:var(--grn);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.top button{border:0;background:none;color:var(--mut);font-weight:700;font-size:15px;padding:6px 0}
.pad{position:sticky;bottom:0;background:var(--bg);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.mu{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-bottom:6px}
.mu button{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:700}
.mu button.on{background:var(--ink);color:var(--bg)}
.ks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ks.c4{grid-template-columns:repeat(4,1fr)}
.k{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:23px;font-weight:800}
.k:active{transform:scale(.95)}
.pad.m2 .k.n{background:var(--red);color:#fff;border-color:var(--red)}
.pad.m3 .k.n{background:var(--grn);color:#fff;border-color:var(--grn)}
.sp2{grid-column:span 2}.sp4{grid-column:span 4}
.cr{width:100%;border-collapse:collapse;text-align:center;background:var(--card);border-radius:14px;overflow:hidden}
.cr td,.cr th{padding:8px 4px;border-bottom:1px solid var(--line);font-size:22px}
.cr th{font-size:15px}.cr th b{font:900 30px 'Big Shoulders Display',sans-serif}
.cr .on{background:rgba(214,173,79,.2)}.cr td:first-child{font:800 22px 'Big Shoulders Display',sans-serif}
.bar{height:8px;border-radius:4px;background:var(--bg);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--grn)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;padding:13px;border:0;background:none;color:var(--mut);font-size:22px;font-weight:800}
.nav .on{color:var(--red)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.tile span{font-size:13px;color:var(--mut)}.tile b{font-size:28px;font-weight:900;line-height:1.1}.tile em{font-style:normal;color:var(--br);font-weight:700}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table.st{border-collapse:collapse;width:100%;min-width:470px;font-variant-numeric:tabular-nums}
.st th,.st td{padding:9px 8px;text-align:right;white-space:nowrap}
.st th:first-child,.st td:first-child{text-align:left;font-weight:700}
.st th{color:var(--mut);font-weight:600;font-size:13px;cursor:pointer}.st th.s{color:var(--red)}
.st tr+tr td{border-top:1px solid var(--line)}
.hi{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.x{border:0;background:none;color:var(--mut);font-size:15px;padding:6px}
.dg{width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(10,12,16,.85);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.ov .card{width:100%;max-width:400px;text-align:center}.ov .big{font-size:64px;color:var(--br)}
#t{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
#t.s{opacity:1}
</style></head><body>
<div id="app"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={players:[],sel:[],session:null,matches:[],cfg:{mode:'x01',start:501,inn:0,out:1,legs:1}};
try{const r=localStorage.getItem('oche');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(!S.session)S.session={id:Date.now(),start:Date.now()};
const save=()=>{try{localStorage.setItem('oche',JSON.stringify(S))}catch(e){}};
let tab='play',G=null,mult=1,flt='abend',sortK='wins',armed='';
const IN=['Straight In','Double In','Master In','Triple In'],OUT=['Straight Out','Double Out','Master Out','Triple Out'],okm=(m,k)=>k==0||(k==1?m==2:k==2?m>=2:m==3),CR=[20,19,18,17,16,15,25],MK=['','/','✕','Ⓧ'];
function flash(m){const t=$('#t');t.textContent=m;t.className='s';clearTimeout(flash.h);flash.h=setTimeout(()=>t.className='',1800)}
function ask(k,f){if(armed===k){armed='';f()}else{armed=k;render();setTimeout(()=>{if(armed===k){armed='';render()}},2500)}}
const sessName=()=>'Spieleabend '+new Date(S.session.start).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
const desc=c=>c.mode=='x01'?`${c.start} · ${IN[c.inn].split(' ')[0]}-In / ${OUT[c.out].split(' ')[0]}-Out${c.legs>1?' · First to '+c.legs:''}`:(c.mode=='cricket'?'Cricket':'Rund um die Uhr')+(c.legs>1?' · First to '+c.legs:'');
/* Setup */
function tog(i){const p=S.players[i],k=S.sel.indexOf(p);k>-1?S.sel.splice(k,1):S.sel.push(p);save();render()}
function add(){const el=$('#np'),n=el.value.trim();if(!n)return;if(S.players.some(p=>p.toLowerCase()==n.toLowerCase()))return flash('Name gibt es schon');S.players.push(n);S.sel.push(n);save();render()}
function rm(i){const p=S.players[i];S.players.splice(i,1);S.sel=S.sel.filter(x=>x!=p);save();render()}
function cfg(k,v){S.cfg[k]=v;save();render()}
function shuf(){for(let i=S.sel.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[S.sel[i],S.sel[j]]=[S.sel[j],S.sel[i]]}save();render();flash('Reihenfolge gemischt')}
const chip=(t,a,f)=>`<button class="ch ${a?'on':''}" onclick="${f}">${t}</button>`;
function setupView(){
 const c=S.cfg,n=S.matches.filter(m=>m.sess===S.session.id).length;
 const modes=[['x01','X01','101 bis 1001'],['cricket','Cricket','15–20 & Bull'],['atc','Rund um die Uhr','1 bis Bull']];
 return `<div class="hero"><div class="board"></div><div><h1>Steeldart</h1><div class="sub">${sessName()} · ${n} ${n==1?'Spiel':'Spiele'}</div></div></div>
<h2>Spieler</h2><div class="row">${S.players.map((p,i)=>{const k=S.sel.indexOf(p);return `<span class="ch ${k>-1?'on':''}" onclick="tog(${i})">${k>-1?(k+1)+'. ':''}${esc(p)}<b onclick="event.stopPropagation();ask('rp${i}',()=>rm(${i}))">${armed=='rp'+i?'löschen?':'×'}</b></span>`}).join('')}</div>
<div class="add"><input id="np" maxlength="14" placeholder="Neuer Spieler" onkeydown="if(event.key=='Enter')add()">${chip('Hinzufügen',1,'add()')}</div>
${S.sel.length>1?'<button class="lnk" onclick="shuf()">Reihenfolge mischen</button>':''}
<h2>Spielmodus</h2><div class="modes">${modes.map(m=>`<button class="md ${c.mode==m[0]?'on':''}" onclick="cfg('mode','${m[0]}')"><b>${m[1]}</b><span>${m[2]}</span></button>`).join('')}</div>
${c.mode=='x01'?`<h2>Startpunkte</h2><div class="row">${[101,301,501,701,1001].map(v=>chip(v,c.start==v,`cfg('start',${v})`)).join('')}</div>
<h2>Einwerfen</h2><div class="row">${IN.map((t,i)=>chip(t,c.inn==i,`cfg('inn',${i})`)).join('')}</div>
<h2>Auswerfen</h2><div class="row">${OUT.map((t,i)=>chip(t,c.out==i,`cfg('out',${i})`)).join('')}</div>`:''}
<h2>Legs zum Sieg</h2><div class="row">${[1,2,3,4,5].map(v=>chip(v,c.legs==v,`cfg('legs',${v})`)).join('')}</div>
<button class="go" onclick="startGame()">Spiel starten</button>
<p class="sub" style="margin-top:20px">Als App installieren: iPhone – Teilen › Zum Home-Bildschirm. Android – Browser-Menü › App installieren. Alle Daten bleiben auf diesem Gerät.</p>`}
/* Spiel */
function startGame(){
 const names=S.sel.filter(n=>S.players.includes(n));if(!names.length)return flash('Wähle mindestens einen Spieler');
 G={cfg:{...S.cfg},names,n:names.length,leg:0,starter:0,legs:names.map(_=>0),st:names.map(_=>({darts:0,pts:0,turns:0,high:0,n180:0,co:0,legWins:0})),undo:[],over:false,last:''};
 newLeg();tab='game';render()}
function newLeg(){const c=G.cfg;G.cur=G.starter;G.turn=[];G.vis=G.names.map(_=>[]);
 if(c.mode=='x01'){G.rem=G.names.map(_=>c.start);G.on=G.names.map(_=>c.inn==0);G.ts=c.start}
 if(c.mode=='cricket'){G.marks=G.names.map(_=>({}));G.sc=G.names.map(_=>0)}
 if(c.mode=='atc')G.tg=G.names.map(_=>1)}
const snap=()=>{G.undo.push(JSON.stringify({...G,undo:[]}));if(G.undo.length>80)G.undo.shift()};
function undo(){if(!G.undo.length)return flash('Nichts zum Rückgängigmachen');if(G.over){S.matches=S.matches.filter(m=>m.id!==G.rec);save()}const u=G.undo;G=JSON.parse(u.pop());G.undo=u;render()}
const lab=(m,n)=>n==0?'–':n==25?(m==2?'Bull':'25'):['','D','T'][m-1]+n;
function dart(n){
 if(G.over)return;let m=mult;mult=1;if(n==0)m=1;
 if(n==25&&m==3){mult=3;return flash('Bull: nur Single oder Double')}
 snap();const c=G.cfg,p=G.cur,s=G.st[p],v=n*m;G.turn.push(lab(m,n));s.darts++;let end=G.turn.length>=3;
 if(c.mode=='x01'){
  if(!G.on[p]&&n>0&&okm(m,c.inn))G.on[p]=true;
  const t=G.rem[p]-(G.on[p]?v:0);
  if(t<0||(t>0&&t<[1,2,2,3][c.out])||(t==0&&!okm(m,c.out))){G.rem[p]=G.ts;G.turn.push('Bust');end=true}
  else{G.rem[p]=t;if(!t)return winLeg(p,G.ts)}
 }else{
  const mk=G.marks[p];
  if(CR.includes(n))for(let k=0;k<m;k++){if((mk[n]||0)<3)mk[n]=(mk[n]||0)+1;else if(G.marks.some((o,i)=>i!=p&&(o[n]||0)<3))G.sc[p]+=n}
  if(CR.every(x=>(mk[x]||0)>=3)&&G.sc[p]>=Math.max(...G.sc))return winLeg(p)}
 end?nextTurn(p):render()}
function atc(m){if(G.over)return;snap();const p=G.cur;G.st[p].darts++;G.turn.push(m?'+'+m:'–');G.tg[p]+=m;if(G.tg[p]>21)return winLeg(p);G.turn.length>=3?nextTurn(p):render()}
function nextTurn(p){const s=G.st[p];
 if(G.cfg.mode=='x01'){const v=G.ts-G.rem[p];s.pts+=v;s.turns++;s.high=Math.max(s.high,v);if(v==180)s.n180++;G.vis[p].push({d:G.turn.slice(),v,r:G.rem[p]})}
 G.last=G.names[p]+': '+G.turn.join(' ');G.cur=(p+1)%G.n;G.turn=[];G.ts=G.rem?G.rem[G.cur]:0;render()}
function winLeg(p,v){const s=G.st[p];
 if(G.cfg.mode=='x01'){s.pts+=v;s.turns++;s.high=Math.max(s.high,v);if(v==180)s.n180++;s.co=Math.max(s.co,v);G.vis[p].push({d:G.turn.slice(),v,r:0,w:1})}
 G.legs[p]++;s.legWins++;
 if(G.legs[p]>=G.cfg.legs)return finish(p);
 G.starter=(G.starter+1)%G.n;G.leg++;newLeg();flash(G.names[p]+' gewinnt das Leg');render()}
function finish(p){G.over=true;G.win=p;G.rec=Date.now();
 S.matches.push({id:G.rec,sess:S.session.id,t:G.rec,mode:G.cfg.mode,desc:desc(G.cfg),players:G.names,win:G.names[p],legs:G.legs,st:G.st.map(s=>({...s}))});save();render()}
function rematch(){S.sel=G.names.slice(1).concat(G.names[0]);save();startGame()}
/* Checkout-Vorschlag */
const ALL=[];for(let i=1;i<=20;i++)ALL.push([i,''+i,1],[i*2,'D'+i,2],[i*3,'T'+i,3]);ALL.push([25,'25',1],[50,'Bull',2]);ALL.sort((a,b)=>b[0]-a[0]);
function cos(r,k,out,mx){const o=[];if(r<2||r>(out==3?180:170)||k<1)return o;const L=d=>okm(d[2],out),F=v=>ALL.find(d=>d[0]==v&&L(d)),add=a=>{if(o.length<mx)o.push(a)};
 const a=F(r);if(a)return[[a[1]]];
 if(k>=2)for(const x of ALL){if(o.length>=mx)break;if(x[0]>=r||x[2]==2)continue;const y=F(r-x[0]);if(y)add([x[1],y[1]])}
 if(k>=3)for(const x of ALL){if(o.length>=mx)break;for(const y of ALL){if(o.length>=mx)break;if(x[0]+y[0]>=r||x[2]==2||y[2]==2)continue;const z=F(r-x[0]-y[0]);if(z)add([x[1],y[1],z[1]])}}
 return o}
const val=l=>l=='–'||l=='Bust'?0:l=='Bull'?50:l[0]=='D'?2*l.slice(1):l[0]=='T'?3*l.slice(1):+l;
function gameView(){
 const c=G.cfg;let b='';
 const pips=i=>c.legs>1?`<span>Legs ${G.legs[i]}/${c.legs}</span>`:'';
 if(c.mode=='x01')b=G.names.map((nm,i)=>{const a=i==G.cur&&!G.over,s=G.st[i],rt=G.on[i]?cos(G.rem[i],a?3-G.turn.length:3,c.out,3):[];
  const sum=G.turn.reduce((q,x)=>q+(x=='Bust'?0:val(x)),0),sl=[0,1,2].map(j=>{const x=G.turn[j];return x?`<i><b>${x}</b><small>${val(x)}</small></i>`:'<i class="e">·</i>'}).join('')+`<div class="sm">${sum}</div>`;
  const vl=G.vis[i].map((q,j)=>`<div><span>${j+1}</span>${q.d.map(x=>`<u class="${x=='Bust'?'bu':''}">${x}</u>`).join('')}<em>${q.w?'Finish':q.d.includes('Bust')?'Bust':q.v}</em><small>${q.r?'Rest '+q.r:''}</small></div>`).reverse().join('');
  const hs=a&&!G.on[i]?`<div class="hint">Start mit ${['','Double','Double oder Triple','Triple'][c.inn]}</div>`:rt.length?`<div class="co ${a?'a':''}"><span>Finish</span>${rt.map((r,j)=>`<p class="${j?'alt':''}">${r.join(' · ')}</p>`).join('')}</div>`:'';
  return `<div class="pc ${a?'on':''}"><div class="pn"><b>${esc(nm)}</b>${pips(i)}<span>Ø ${s.turns?(s.pts/s.turns).toFixed(1):'–'}</span></div><div class="mid"><div class="big">${G.rem[i]}</div>${a?`<div class="sl">${sl}</div>`:''}</div>${hs}${vl?`<div class="vl">${vl}</div>`:''}</div>`}).join('');
 if(c.mode=='cricket')b=`<table class="cr"><tr><th></th>${G.names.map((n,i)=>`<th class="${i==G.cur?'on':''}">${esc(n)}<br><b>${G.sc[i]}</b></th>`).join('')}</tr>${CR.map(n=>`<tr><td>${n==25?'Bull':n}</td>${G.names.map((_,i)=>`<td class="${i==G.cur?'on':''}">${MK[G.marks[i][n]||0]}</td>`).join('')}</tr>`).join('')}</table>`;
 if(c.mode=='atc')b=G.names.map((nm,i)=>{const t=G.tg[i],a=i==G.cur;return `<div class="pc ${a?'on':''}"><div class="pn"><b>${esc(nm)}</b>${pips(i)}<span>Ziel</span></div><div class="big">${t>20?'Bull':t}</div><div class="bar"><i style="width:${(t-1)/21*100}%"></i></div></div>`}).join('');
 const turn=c.mode!='x01'?`<div class="th" style="margin:10px 0">${G.turn.map(d=>`<i>${d}</i>`).join('')}</div>`:'';
 const ks=c.mode=='x01'?`<div class="ks">${Array.from({length:20},(_,i)=>`<button class="k n" onclick="dart(${i+1})">${i+1}</button>`).join('')}<button class="k n" onclick="dart(25)">Bull</button><button class="k sp4" onclick="dart(0)">Daneben</button></div>`
  :c.mode=='cricket'?`<div class="ks c4">${CR.map(n=>`<button class="k n" onclick="dart(${n})">${n==25?'Bull':n}</button>`).join('')}<button class="k" onclick="dart(0)">Daneben</button></div>`
  :`<div class="ks c4"><button class="k" onclick="atc(0)">Daneben</button>${[1,2,3].map(m=>`<button class="k n" style="background:var(--grn);color:#fff" onclick="atc(${m})">${['Single','Double','Triple'][m-1]}</button>`).join('')}</div>`;
 const mu=c.mode=='atc'?'':`<div class="mu">${['Single','Double','Triple'].map((t,i)=>`<button class="${mult==i+1?'on':''}" onclick="mult=${i+1};render()">${t}</button>`).join('')}<button onclick="undo()">↶ Zurück</button></div>`;
 const ov=G.over?`<div class="ov"><div class="card"><div class="sub">Spiel gewonnen</div><div class="big">${esc(G.names[G.win])}</div>
 <p class="sub">${esc(desc(c))}${c.mode=='x01'?' · Ø '+(G.st[G.win].darts?(G.st[G.win].pts/G.st[G.win].darts*3).toFixed(1):'–')+' · Max '+G.st[G.win].high:''}</p>
 <button class="go" style="font-size:26px;margin-top:8px" onclick="rematch()">Revanche</button><button class="dg" onclick="undo()">Letzten Wurf rückgängig</button><button class="dg" onclick="G=null;tab='stats';render()">Statistik ansehen</button></div></div>`:'';
 return `<div class="top"><button onclick="ask('quit',()=>{G=null;tab='play';render()})">${armed=='quit'?'Wirklich abbrechen?':'✕ Abbrechen'}</button><span class="sub">${esc(desc(c))}</span></div>${G.last?`<div class="sub" style="margin-bottom:8px">Zuletzt ${esc(G.last)}</div>`:''}${b}${turn}<div class="pad m${mult}">${mu}${ks}</div>${ov}`}
/* Statistik */
function agg(L){const m={};L.forEach(r=>r.st.forEach((s,i)=>{const n=r.players[i],a=m[n]||(m[n]={n,games:0,wins:0,pts:0,dd:0,high:0,n180:0,co:0});a.games++;if(r.win==n)a.wins++;if(r.mode=='x01'){a.pts+=s.pts;a.dd+=s.darts;a.high=Math.max(a.high,s.high);a.n180+=s.n180;a.co=Math.max(a.co,s.co)}}));
 return Object.values(m).map(a=>({...a,q:a.wins/a.games*100,avg:a.dd?a.pts/a.dd*3:0}))}
function statsView(){
 const L=flt=='abend'?S.matches.filter(m=>m.sess===S.session.id):S.matches,A=agg(L).sort((a,b)=>sortK=='n'?a.n.localeCompare(b.n):b[sortK]-a[sortK]);
 const aw=[['Meiste Siege','wins',v=>v+' Siege'],['Bester Schnitt','avg',v=>v.toFixed(1)+' Ø'],['Meiste Punkte','pts',v=>v+' Pkt.'],['Höchste Aufnahme','high',v=>v],['Meiste 180er','n180',v=>v+'×'],['Höchstes Finish','co',v=>v]];
 const tiles=aw.map(([l,k,f])=>{const t=A.slice().sort((a,b)=>b[k]-a[k])[0];return t&&t[k]>0?`<div class="tile"><span>${l}</span><b>${esc(t.n)}</b><em>${f(t[k])}</em></div>`:''}).join('');
 const cols=[['n','Spieler'],['games','Sp.'],['wins','Siege'],['q','Quote'],['avg','Ø'],['pts','Punkte'],['high','Max'],['n180','180'],['co','CO']];
 const fm=(k,a)=>k=='q'?Math.round(a.q)+'%':k=='avg'?(a.avg?a.avg.toFixed(1):'–'):a[k]||(k=='n'?a.n:0);
 return `<h1>Statistik</h1><div class="row" style="margin:12px 0">${chip('Dieser Abend',flt=='abend',"flt='abend';render()")}${chip('Gesamt',flt=='all',"flt='all';render()")}</div>
${!L.length?`<div class="card">Noch keine Spiele ${flt=='abend'?'an diesem Abend':''}. Spiele eine Runde – nach dem Sieg erscheinen hier Siege, Schnitt, Punkte und Rekorde.</div>`:`
<div class="tiles">${tiles}</div><h2>Rangliste</h2><div class="tw"><table class="st"><tr>${cols.map(([k,t])=>`<th class="${sortK==k?'s':''}" onclick="sortK='${k}';render()">${t}</th>`).join('')}</tr>${A.map(a=>`<tr>${cols.map(([k])=>`<td>${k=='n'?esc(a.n):fm(k,a)}</td>`).join('')}</tr>`).join('')}</table></div>
<p class="sub">Ø = 3-Dart-Average (nur X01). CO = höchstes Finish. Tippe auf eine Spalte zum Sortieren.</p>
<h2>Spiele</h2>${L.slice().reverse().map(m=>`<div class="hi"><div><b>${esc(m.win)}</b> gewinnt · ${esc(m.desc)}<br><span class="sub">${esc(m.players.join(', '))} · ${new Date(m.t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</span></div><button class="x" onclick="ask('dm${m.id}',()=>{S.matches=S.matches.filter(x=>x.id!=${m.id});save();render()})">${armed=='dm'+m.id?'löschen?':'×'}</button></div>`).join('')}`}
<button class="dg" onclick="ask('ne',()=>{S.session={id:Date.now(),start:Date.now()};flt='abend';save();flash('Neuer Spieleabend gestartet');render()})">${armed=='ne'?'Wirklich neuen Abend starten?':'Neuer Spieleabend'}</button>
<button class="dg" onclick="ask('ca',()=>{S.matches=[];save();render()})">${armed=='ca'?'Wirklich alles löschen?':'Alle Statistiken löschen'}</button>`}
const nav=()=>`<div class="nav"><button class="${tab=='play'?'on':''}" onclick="tab='play';render()">Spiel</button><button class="${tab=='stats'?'on':''}" onclick="tab='stats';render()">Statistik</button></div>`;
function render(){const y=scrollY,a=$('#app');a.innerHTML=tab=='game'&&G?gameView():(tab=='stats'?statsView():setupView())+nav();
 if(tab=='game'&&G){const e=document.querySelector('.pc.on');e&&e.scrollIntoView({block:'nearest'})}else scrollTo(0,y)}
if(tab=='game'&&!G)tab='play';render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
